name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity. A tiny
# read every few days keeps the newspaper's backend running.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets not set yet — nothing to do."; exit 0; fi
          curl -fsS "$URL/rest/v1/sections?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Backend is awake."
