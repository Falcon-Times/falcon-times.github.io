name: Keep Supabase awake

# Free Supabase projects pause after a week they consider idle. Plain API reads turned out not
# to be enough, so every day this makes a small database write, a read, an auth call and a
# storage call (scripts/keepalive.sh). It is a mitigation, not a guarantee: only a paid Supabase
# plan prevents pausing. If this workflow fails, GitHub emails the repository's admins.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/keepalive.sh
      - run: ./scripts/keepalive.sh
