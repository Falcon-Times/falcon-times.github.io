name: Deploy database & functions

# Applies supabase/migrations and deploys the admin-users Edge Function to
# your Supabase project. Run it manually from the Actions tab (or push changes
# under supabase/ to main, or to this file). Needs three repository secrets — see docs/SETUP.md.
#
# Written for Supabase CLI 3.x, where commands default to the *local* database and a hosted
# project must be targeted with --remote (the linked project). The CLI is installed at "latest",
# so a future major version may change commands again: if this workflow starts failing right
# after a CLI release, read the first error and check `supabase <command> --help`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see docs/SETUP.md)"; exit 1; fi
          done
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # --remote = the linked project (without it 3.x pushes to a local database); --yes is needed
      # for changes to a hosted project when nobody is there to confirm.
      - run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - run: supabase functions deploy admin-users --no-verify-jwt --yes
